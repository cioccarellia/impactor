apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 36

    defaultConfig {
        applicationId "com.andreacioccarelli.impactor"
        minSdk 21
        targetSdk 36
        versionCode 105
        versionName "5.9.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.andreacioccarelli.impactor'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

    // Explicit AndroidX stack. Without these, the whole UI toolkit is inherited
    // transitively (and via Jetifier) from the old support-library dependencies of
    // material-dialogs / material-about-library, which pins it to the 2018 releases.
    //
    // These are held at the newest versions that still work with minSdk 21 and
    // compileSdk 36 -- do not bump them piecemeal, they all fail as a group:
    //   appcompat  1.8.0  / core-ktx 1.18.0 / activity 1.12.0
    //   lifecycle  2.10.0 / browser  1.10.0 / material 1.14.0   -> all need minSdk 23
    //   core-ktx   1.19.0                                       -> needs compileSdk 37 (AGP 9)
    // Moving past this line means raising minSdk to 23, and for core-ktx also going to
    // AGP 9 -- which first requires replacing material-dialogs and material-about-library,
    // because AGP 9 drops the Jetifier they still depend on.
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.7.1'
    //noinspection GradleDependency
    implementation 'androidx.core:core-ktx:1.17.0'
    //noinspection GradleDependency
    implementation 'androidx.activity:activity-ktx:1.11.0'
    //noinspection GradleDependency
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    //noinspection GradleDependency
    implementation 'androidx.browser:browser:1.9.0'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.afollestad.material-dialogs:core:0.9.6.0'
    implementation 'com.jrummyapps:android-shell:1.0.1'
    implementation 'com.github.GrenderG:Toasty:1.5.2'
    implementation 'com.jaredrummler:android-device-names:2.1.1'
    // Newest release is only 3.2.0-rc01; staying on the last stable.
    //noinspection GradleDependency
    implementation 'com.github.daniel-stoneuk:material-about-library:2.4.2'
}
